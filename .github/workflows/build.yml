name: Build & Deploy (Astro)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Copy layout
        working-directory: site
        run: node scripts/copy-layout.mjs

      - name: Build Astro
        working-directory: site
        run: npm run build:astro

      # Bản sao cấp gốc: copy .astro-dist/vi/** lên root để các URL cũ không có
      # tiền tố ngôn ngữ ('/tim-tour/', '/tours/<slug>/', '/tours/khu-vuc/<region>/')
      # tồn tại thật (GitHub Pages không có redirect server-side). Canonical của
      # bản sao đã trỏ về '/vi/…' sẵn nên không sinh duplicate content.
      - name: Copy /vi/* lên root (bản sao không tiền tố ngôn ngữ)
        working-directory: site
        run: node scripts/copy-vi-to-root.mjs

      # URL cũ (site ASP.NET trước) đang được Google index: sinh trang 200 có
      # canonical + đếm giờ JS chuyển sang địa chỉ mới (thay cho 404).
      - name: Sinh trang chuyển hướng cho URL cũ
        working-directory: site
        run: node scripts/build-legacy-redirects.mjs

      # URL tiếng Anh (/en/…) đã bỏ nhưng đang được Google index: soi cây /vi/
      # vừa build rồi sinh /en/<tương ứng>/ trả 200 + canonical về bản tiếng Việt.
      - name: Sinh trang chuyển hướng /en/ → /vi/
        working-directory: site
        run: node scripts/build-en-redirects.mjs

      - name: Copy extra assets
        working-directory: site
        run: |
          mkdir -p .astro-dist/admin
          cp admin/config.json .astro-dist/admin/config.json
          cp -r ../content .astro-dist/content
          cp -r ../layouts .astro-dist/layouts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.astro-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
