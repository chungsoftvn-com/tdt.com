name: Build & Deploy (Astro)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Copy layout
        working-directory: site
        run: node scripts/copy-layout.mjs

      - name: Sinh lastmod cho sitemap
        working-directory: site
        run: node scripts/gen-lastmod.mjs

      - name: Build Astro
        working-directory: site
        run: npm run build:astro

      # Bản sao cấp gốc: copy .astro-dist/vi/** lên root để các URL cũ không có
      # tiền tố ngôn ngữ ('/tim-tour/', '/tours/<slug>/', '/tours/khu-vuc/<region>/')
      # tồn tại thật (GitHub Pages không có redirect server-side). Canonical của
      # bản sao đã trỏ về '/vi/…' sẵn nên không sinh duplicate content.
      - name: Copy /vi/* lên root (bản sao không tiền tố ngôn ngữ)
        working-directory: site
        run: node scripts/copy-vi-to-root.mjs

      # URL cũ (site ASP.NET trước) đang được Google index: sinh trang 200 có
      # canonical + đếm giờ JS chuyển sang địa chỉ mới (thay cho 404).
      - name: Sinh trang chuyển hướng cho URL cũ
        working-directory: site
        run: node scripts/build-legacy-redirects.mjs

      # URL tiếng Anh (/en/…) đã bỏ nhưng đang được Google index: soi cây /vi/
      # vừa build rồi sinh /en/<tương ứng>/ trả 200 + canonical về bản tiếng Việt.
      - name: Sinh trang chuyển hướng /en/ → /vi/
        working-directory: site
        run: node scripts/build-en-redirects.mjs

      - name: Copy extra assets
        working-directory: site
        run: |
          mkdir -p .astro-dist/admin
          cp admin/config.json .astro-dist/admin/config.json
          cp -r ../content .astro-dist/content
          cp -r ../layouts .astro-dist/layouts

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.astro-dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Báo IndexNow (Bing)
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "Không có commit trước để so sánh; bỏ qua IndexNow."
            exit 0
          fi
          git diff --name-only "$BEFORE" "$GITHUB_SHA" -- content/vi > "$RUNNER_TEMP/indexnow-files.txt"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const urls = new Set();
          const pageNames = { testimonials: 'y-kien-khach-hang', partners: 'doi-tac', news: 'tin-tuc' };
          for (const file of readFileSync(join(process.env.RUNNER_TEMP, 'indexnow-files.txt'), 'utf8').split(/\r?\n/)) {
            if (file.split('/').includes('images')) continue;
            // Review data changes affect tour pages, not a /tour-reviews/ page.
            if (file === 'content/vi/tour-reviews.json') {
              const index = JSON.parse(readFileSync('content/vi/tours.json', 'utf8'));
              for (const slug of index.order || []) {
                const tour = JSON.parse(readFileSync('content/vi/tours/' + slug + '.json', 'utf8'));
                if (!tour.hidden) urls.add('https://todaytourist.com/vi/tours/' + slug + '/');
              }
              continue;
            }
            let match;
            let path = null;
            if ((match = file.match(/^content\/vi\/news\/([^/]+)\.json$/))) {
              path = '/vi/tin-tuc/' + match[1] + '/';
            } else if ((match = file.match(/^content\/vi\/tours\/([^/]+)\.json$/))) {
              if (match[1] !== 'khu-vuc') path = '/vi/tours/' + match[1] + '/';
            } else if ((match = file.match(/^content\/vi\/([^/]+)\.json$/))) {
              const slug = match[1];
              path = slug === 'home' ? '/vi/' : '/vi/' + (pageNames[slug] || slug) + '/';
            }
            if (path) urls.add('https://todaytourist.com' + path);
            if (urls.size >= 10000) break;
          }
          if (urls.size) {
            writeFileSync(join(process.env.RUNNER_TEMP, 'indexnow-payload.json'), JSON.stringify({
              host: 'todaytourist.com',
              key: '87d131c0969c9dc7ed9c16f4ca6460fc',
              keyLocation: 'https://todaytourist.com/87d131c0969c9dc7ed9c16f4ca6460fc.txt',
              urlList: [...urls],
            }));
          }
          console.log('IndexNow: ' + urls.size + ' URL.');
          NODE
          if [[ ! -s "$RUNNER_TEMP/indexnow-payload.json" ]]; then
            echo "Không có URL content thay đổi; bỏ qua IndexNow."
            exit 0
          fi
          curl --silent --show-error --output "$RUNNER_TEMP/indexnow-response.txt" --write-out 'IndexNow HTTP: %{http_code}\n' \
            --request POST 'https://api.indexnow.org/indexnow' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --data-binary "@$RUNNER_TEMP/indexnow-payload.json"
